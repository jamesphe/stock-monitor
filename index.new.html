<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股票信号监控系统</title>
    <!-- TailwindCSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js CDN -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- 图表库 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 自定义CSS -->
    <link rel="stylesheet" href="static/css/main.css">
    <!-- 工具函数 -->
    <script src="static/js/utils.js"></script>
    <!-- 组件 -->
    <script src="static/js/components.js"></script>
    <!-- 主应用逻辑 -->
    <script src="static/js/stockMonitor.js"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div x-data="stockMonitor()" class="min-h-screen">
        <!-- 头部导航 -->
        <header class="bg-blue-600 text-white shadow-md">
            <div class="container mx-auto px-4 py-4">
                <div class="flex justify-between items-center">
                    <h1 class="text-2xl font-bold">📈 股票信号监控系统</h1>
                    <div class="flex items-center space-x-2">
                        <span x-show="!akshareAvailable" class="bg-yellow-500 text-black px-2 py-1 rounded text-sm">
                            ⚠️ AKshare未安装，使用备选数据源
                        </span>
                    </div>
                </div>
            </div>
        </header>

        <!-- 主内容区 -->
        <main class="container mx-auto px-4 py-6">
            <div class="flex flex-col lg:flex-row gap-6">
                <!-- 左侧边栏 -->
                <div class="w-full lg:w-1/3 space-y-6">
                    <!-- 系统配置面板 -->
                    <div class="bg-white rounded-lg shadow-md p-4">
                        <h2 class="text-xl font-semibold mb-4">⚙️ 系统配置</h2>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-700">
                                企业微信机器人Webhook
                                <div class="mt-1 relative rounded-md shadow-sm">
                                    <input 
                                        type="password" 
                                        x-model="config.wecom_webhook" 
                                        @change="saveConfig()"
                                        class="block w-full pr-10 border-gray-300 rounded-md focus:ring-blue-500 focus:border-blue-500" 
                                        placeholder="填入企业微信机器人的Webhook地址" 
                                    >
                                </div>
                                <p class="mt-1 text-xs text-gray-500">填入企业微信机器人的Webhook地址，用于接收告警通知</p>
                            </label>
                        </div>
                    </div>

                    <!-- 添加监控面板 - 此处省略具体内容，后续从组件加载 -->
                    <div id="add-monitor-panel" class="bg-white rounded-lg shadow-md p-4">
                        <h2 class="text-xl font-semibold mb-4">📋 添加监控</h2>
                        <!-- 添加监控的内容将在后续完成 -->
                    </div>
                </div>

                <!-- 右侧主内容 -->
                <div class="w-full lg:w-2/3 space-y-6">
                    <!-- 已监控股票列表 - 此处省略具体内容，后续从组件加载 -->
                    <div id="stock-list-panel" class="bg-white rounded-lg shadow-md p-4">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-xl font-semibold">📊 监控列表</h2>
                            <button 
                                @click="runMonitoring()"
                                class="bg-green-600 hover:bg-green-700 text-white py-2 px-4 rounded-md focus:outline-none focus:ring-2 focus:ring-green-500 focus:ring-offset-2"
                                :disabled="isRunningMonitor"
                                :class="{'opacity-50 cursor-not-allowed': isRunningMonitor}"
                            >
                                <span x-show="!isRunningMonitor">立即执行监控</span>
                                <span x-show="isRunningMonitor">执行中...</span>
                            </button>
                        </div>
                        <!-- 监控列表的内容将在后续完成 -->
                    </div>

                    <!-- 股票图表区域 -->
                    <div x-show="selectedStock" class="bg-white rounded-lg shadow-md p-4">
                        <h2 class="text-xl font-semibold mb-4">
                            <span x-text="selectedStock && (selectedStock.name || selectedStock.code)"></span> 数据图表
                        </h2>
                        <div class="h-80">
                            <canvas id="stockChart"></canvas>
                        </div>
                    </div>

                    <!-- 告警历史 -->
                    <div id="alert-history-panel" class="bg-white rounded-lg shadow-md p-4">
                        <h2 class="text-xl font-semibold mb-4">🔔 告警历史</h2>
                        <!-- 告警历史的内容将在后续完成 -->
                    </div>
                </div>
            </div>
        </main>

        <!-- 底部 -->
        <footer class="bg-gray-800 text-white py-4">
            <div class="container mx-auto px-4 text-center text-sm">
                <p>📈 股票信号监控系统 | 基于Alpine.js和TailwindCSS构建</p>
            </div>
        </footer>
        
        <!-- 监控结果模态窗口 -->
        <div 
            x-show="showMonitorResults" 
            class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0"
            x-transition:enter-end="opacity-100"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100"
            x-transition:leave-end="opacity-0"
        >
            <div 
                @click.away="showMonitorResults = false"
                class="bg-white rounded-lg shadow-xl max-w-4xl w-full max-h-[80vh] overflow-y-auto"
                x-transition:enter="transition ease-out duration-300"
                x-transition:enter-start="opacity-0 scale-95"
                x-transition:enter-end="opacity-100 scale-100"
                x-transition:leave="transition ease-in duration-200"
                x-transition:leave-start="opacity-100 scale-100"
                x-transition:leave-end="opacity-0 scale-95"
            >
                <!-- 模态窗口内容将在后续完成 -->
                <div id="monitor-results-modal" class="p-6">
                </div>
            </div>
        </div>
    </div>
    
    <!-- 组件加载脚本 -->
    <script src="static/js/loadComponents.js"></script>
</body>
</html>
